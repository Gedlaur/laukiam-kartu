<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laukiam kartu">
<meta name="theme-color" content="#a9dcff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="ikona-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Laukiam kartu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* =========================================================
   ✨ KODO PASLAPTIS ✨
   Čia gyvena padarėlių „nustatymai“. Pakeisk reikšmę ir žiūrėk!
   ========================================================= */
:root {
  --spurgos-spalva: #a9d8f5;       /* Spurgos kailiuko spalva */
  --nosytes-spalva: #9b6bd6;       /* Spurgos nosytė */
  --dekucio-spalva: #fff0a6;       /* Spurgos dekutis */
  --mieguistumas: 9s;              /* kas kiek laiko Spurga užmiega ir atsikelia */
  --skrydzio-greitis: 16s;         /* kaip greitai skraido Lietuviukas */
  --sirdeles-megztinis: #bba792;   /* Širdelės megztinuko spalva */
  --sirdeles-sijonas: #ecbcc4;     /* Širdelės sijonėlio spalva */
  --pasipūtimas: 8s;               /* kas kiek laiko Širdelė pasipučia */
  --braskes-plaukai: #c8553d;      /* Braškės plaukų spalva */
  --braskes-kelnes: #e0489c;       /* Braškės kelnių spalva */
  --protingumas: 10s;              /* kas kiek laiko Braškei šauna gera mintis */
}

/* Pasaulio spalvos (vienas, visada šviesus pasaulis) */
:root {
  /* Pasaulis: dangus viršuje, kalvos ir žolė apačioje, padarėliai danguje ir ant žolės */
  --dangus-virsus: #a9dcff;
  --dangus-apacia: #fde7d8;
  --saule: #ffd66b;
  --debesis: #ffffff;
  --kalva-tolima: #c3e8c9;
  --kalva-vidurine: #9fdaa9;
  --zole: #84cc8f;
  --zole-tamsi: #6bb878;
  --kontūras: #3b4a63;
  --spurgos-seselis: #7fb3db;
  --tekstas: #4a3b5c;
  --tekstas-svelnus: #7a6c8a;
  --akcentas: #f08a5d;
  --akcentas-tamsus: #d9673a;
  --kortele: #ffffff;
  --skydelis: #fff6ee;
  --klaida: #c6384f;
  --lenta: #eebc80;
  --lenta-tamsi: #b9834a;
  --lenta-tekstas: #5c3a17;

  --sriftas-didelis: "Grandstander", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  --sriftas: "Nunito", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--dangus-apacia);
  color: var(--tekstas);
  font-family: var(--sriftas);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.pasaulis {
  position: relative;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, var(--dangus-virsus) 0%, #cfeaff 45%, var(--dangus-apacia) 70%);
}

/* ---------- Pavadinimas ---------- */
.pavadinimas {
  position: absolute;
  top: 17%;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}
.pavadinimas h1 {
  margin: 0;
  padding: 16px 30px 20px;
  font-family: var(--sriftas-didelis);
  font-weight: 800;
  font-size: clamp(50px, 15vw, 80px);
  line-height: 0.95;
  text-align: center;
  color: var(--tekstas);
  background: rgba(255, 255, 255, 0.72);
  border-radius: 36px;
  box-shadow: 0 8px 24px rgba(74, 59, 92, 0.14);
  transform: rotate(-3deg);
}
.pavadinimas h1 span { display: block; }
.pavadinimas h1 span + span { color: #f08a5d; transform: translateX(14px); }

/* ---------- Saulė ---------- */
.saule {
  position: absolute;
  top: 9%;
  right: -28px;
  width: 150px;
  height: 150px;
}
.saule .spinduliai {
  transform-origin: 75px 75px;
  animation: suktis 40s linear infinite;
}
@keyframes suktis { to { transform: rotate(360deg); } }

/* ---------- Debesys ---------- */
.debesis {
  position: absolute;
  left: 0;
  width: 130px;
  animation: plaukti linear infinite;
  filter: drop-shadow(0 6px 8px rgba(120, 160, 200, 0.18));
}
.debesis.d1 { top: 15%; width: 140px; animation-duration: 70s; animation-delay: -20s; }
.debesis.d2 { top: 27%; width: 100px; animation-duration: 95s; animation-delay: -70s; opacity: .9; }
.debesis.d3 { top: 38%; width: 80px;  animation-duration: 120s; animation-delay: -35s; opacity: .8; }
@keyframes plaukti {
  from { transform: translateX(-160px); }
  to   { transform: translateX(calc(100vw + 20px)); }
}

/* ---------- Žemė ---------- */
.zeme {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 52%;
}
.zeme svg { display: block; width: 100%; height: 100%; }

.gele {
  position: absolute;
  width: 26px;
  transform-origin: 50% 100%;
  animation: siubuoti 3.5s ease-in-out infinite;
}
@keyframes siubuoti {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
}

/* ---------- Lietuviukas (skraidūnas) ---------- */
.lietuviukas-skrydis {
  position: absolute;
  top: 3%;
  left: 4%;
  width: min(40vw, 170px);
  z-index: 6;
  animation: skristi var(--skrydzio-greitis) ease-in-out infinite;
}
@keyframes skristi {
  0%   { transform: translateX(0) scaleX(1); }
  47%  { transform: translateX(min(42vw, 240px)) scaleX(1); }
  50%  { transform: translateX(min(42vw, 240px)) scaleX(-1); }
  97%  { transform: translateX(0) scaleX(-1); }
  100% { transform: translateX(0) scaleX(1); }
}
.lietuviukas {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  animation: supuotis 1.6s ease-in-out infinite;
}
@keyframes supuotis {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(10px) rotate(2deg); }
}
.l-sparnas {
  transform-box: view-box;
  transform-origin: 150px 72px;
  animation: plasnoti 0.45s ease-in-out infinite alternate;
}
@keyframes plasnoti {
  from { transform: rotate(4deg); }
  to   { transform: rotate(-14deg); }
}
.l-uodega {
  transform-box: view-box;
  transform-origin: 68px 88px;
  animation: uodega 1.6s ease-in-out infinite;
}
@keyframes uodega {
  0%, 100% { transform: rotate(-4deg); }
  50%      { transform: rotate(5deg); }
}
.l-snapas-apacia {
  transform-box: view-box;
  transform-origin: 222px 66px;
  animation: dainuoti 2.4s ease-in-out infinite;
}
@keyframes dainuoti {
  0%, 55%, 100% { transform: rotate(0deg); }
  62%, 76%      { transform: rotate(14deg); }
  69%, 83%      { transform: rotate(2deg); }
}
.l-akis {
  transform-box: fill-box;
  transform-origin: 50% 60%;
  animation: mirksti 3.6s ease-in-out infinite;
  animation-delay: -1.2s;
}
@keyframes mirksti {
  0%, 90%, 100% { transform: scaleY(1); }
  93%           { transform: scaleY(0.08); }
  96%           { transform: scaleY(1); }
}

/* ---------- Spurga (juokingas mieguistas šuniukas) ---------- */
.spurgos-vieta {
  position: absolute;
  left: 50%;
  bottom: 9%;
  width: min(86vw, 360px);
  transform: translateX(-50%);
  z-index: 3;
}
.spurga { display: block; width: 100%; height: auto; overflow: visible; }

.s-kunas {
  transform-box: view-box;
  transform-origin: 160px 170px;
  animation: kvepuoti 4.5s ease-in-out infinite;
}
@keyframes kvepuoti {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(1.02, 0.975); }
}
.s-akis {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: snausti var(--mieguistumas) ease-in-out infinite;
}
@keyframes snausti {
  0%, 28%   { transform: scaleY(1); }
  38%, 60%  { transform: scaleY(0.1); }    /* užmiega... */
  63%       { transform: scaleY(1.25); }   /* ups, pabudo! */
  68%, 86%  { transform: scaleY(1); }
  89%       { transform: scaleY(0.1); }
  92%, 100% { transform: scaleY(1); }
}
/* Galva: nusvyra ant letenėlių (užmiega), tada staigiai pakyla (atsikelia!) */
.s-galva {
  transform-box: view-box;
  transform-origin: 112px 108px;
  animation: galva var(--mieguistumas) ease-in-out infinite;
}
@keyframes galva {
  0%, 28%   { transform: translateY(0) rotate(0deg); }
  40%, 60%  { transform: translateY(16px) rotate(-14deg); }   /* miega */
  63%       { transform: translateY(-10px) rotate(5deg); }    /* ups! atsikėlė */
  67%       { transform: translateY(0) rotate(-2deg); }
  70%, 100% { transform: translateY(0) rotate(0deg); }
}
.s-antakis {
  animation: antakis var(--mieguistumas) ease-in-out infinite;
}
@keyframes antakis {
  0%, 68%, 100% { transform: translateY(0); }
  72%, 80%      { transform: translateY(-4px); }   /* „Hm? Aš nemiegojau!“ */
  76%           { transform: translateY(0); }
}
.s-ausis-desine {
  transform-box: view-box;
  transform-origin: 132px 42px;
  animation: ausis 5s ease-in-out infinite;
}
@keyframes ausis {
  0%, 70%, 100% { transform: rotate(0deg); }
  74%, 82%      { transform: rotate(10deg); }
  78%           { transform: rotate(-3deg); }
}
.zzz {
  font-family: var(--sriftas-didelis);
  font-weight: 800;
  fill: #8a7fd0;
  opacity: 0;
  animation: zzz var(--mieguistumas) ease-out infinite;
}
.zzz.z2 { animation-delay: .5s; }
.zzz.z3 { animation-delay: 1s; }
@keyframes zzz {
  0%, 36%  { opacity: 0; transform: translate(0, 0); }
  42%      { opacity: 1; }
  64%      { opacity: 0; transform: translate(14px, -26px); }
  100%     { opacity: 0; transform: translate(14px, -26px); }
}

.p-megztinis-fonas { fill: var(--sirdeles-megztinis); }
.p-sijono-spalva { fill: var(--sirdeles-sijonas); }

/* ---------- Širdelė (miela, gera, maloni, bet truputį pasipūtusi pelytė) ---------- */
.sirdeles-vieta {
  position: absolute;
  right: 1%;
  bottom: 31%;
  width: min(29vw, 124px);
  z-index: 2;
}
.sirdele { display: block; width: 100%; height: auto; overflow: visible; }
.p-visa {
  transform-box: view-box;
  transform-origin: 60px 218px;
  animation: p-kvepuoti 3.2s ease-in-out infinite;
}
@keyframes p-kvepuoti {
  0%, 100% { transform: scaleY(1); }
  50%      { transform: scaleY(1.015); }
}
.p-sijonas {
  transform-box: view-box;
  transform-origin: 60px 132px;
  animation: p-sijonas 2.6s ease-in-out infinite;
}
@keyframes p-sijonas {
  0%, 100% { transform: rotate(-2.5deg); }
  50%      { transform: rotate(2.5deg); }
}
/* Pasipūtimas: nosytė į viršų, akys užsimerkia – „Hmf!“ */
.p-galva {
  transform-box: view-box;
  transform-origin: 60px 76px;
  animation: p-galva var(--pasipūtimas) ease-in-out infinite;
}
@keyframes p-galva {
  0%, 48%, 84%, 100% { transform: rotate(0deg) translateY(0); }
  55%, 76%           { transform: rotate(-11deg) translateY(-3px); }
}
.p-akis {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: p-akys var(--pasipūtimas) ease-in-out infinite;
}
@keyframes p-akys {
  0%, 18%, 24%, 50%, 82%, 100% { transform: scaleY(1); }
  21%                          { transform: scaleY(0.1); }
  56%, 76%                     { transform: scaleY(0.15); }
}
.p-usai {
  transform-box: fill-box;
  transform-origin: 100% 50%;
  animation: p-usai 2.2s ease-in-out infinite;
}
.p-usai.desine { transform-origin: 0% 50%; animation-delay: -1.1s; }
@keyframes p-usai {
  0%, 70%, 100% { transform: rotate(0deg); }
  76%           { transform: rotate(-7deg); }
  82%           { transform: rotate(5deg); }
}
.p-sirdute {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: p-sirdute var(--pasipūtimas) ease-out infinite;
}
@keyframes p-sirdute {
  0%, 54%  { opacity: 0; transform: translate(0, 0) scale(.6); }
  60%      { opacity: 1; transform: translate(0, -6px) scale(1); }
  80%      { opacity: 0; transform: translate(6px, -26px) scale(1.1); }
  100%     { opacity: 0; }
}

/* ---------- Braškė (juokinga, protinga, išmintinga lėlė ant lazdelės) ---------- */
.braskes-vieta {
  position: absolute;
  left: 6%;
  bottom: 32%;
  width: min(31vw, 124px);
  z-index: 2;
}
.braske { display: block; width: 100%; height: auto; overflow: visible; }
.b-plaukai { fill: var(--braskes-plaukai); }
.b-kelnes { fill: var(--braskes-kelnes); }
.b-visa {
  transform-box: view-box;
  transform-origin: 50px 230px;
  animation: b-siubuoti 3.4s ease-in-out infinite;
}
@keyframes b-siubuoti {
  0%, 100% { transform: rotate(-2.5deg); }
  50%      { transform: rotate(2.5deg); }
}
/* Pirma „Hmm...“ (galva pakrypsta), tada „Aha!“ (užsidega lemputė) */
.b-galva {
  transform-box: view-box;
  transform-origin: 50px 82px;
  animation: b-galva var(--protingumas) ease-in-out infinite;
}
@keyframes b-galva {
  0%, 36%, 100% { transform: rotate(0deg); }
  42%, 54%      { transform: rotate(8deg); }
  58%           { transform: rotate(-3deg) translateY(-2px); }
  62%, 80%      { transform: rotate(0deg); }
}
.b-antakiai {
  animation: b-antakiai var(--protingumas) ease-in-out infinite;
}
@keyframes b-antakiai {
  0%, 56%, 84%, 100% { transform: translateY(0); }
  60%, 80%           { transform: translateY(-2.5px); }
}
.b-akis {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: mirksti 4.2s ease-in-out infinite;
  animation-delay: -2s;
}
.b-sypsena-maza { animation: b-maza var(--protingumas) step-end infinite; }
.b-sypsena-didele { opacity: 0; animation: b-didele var(--protingumas) step-end infinite; }
@keyframes b-maza   { 0% { opacity: 1; } 58% { opacity: 0; } 82% { opacity: 1; } }
@keyframes b-didele { 0% { opacity: 0; } 58% { opacity: 1; } 82% { opacity: 0; } }
.b-lempute {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: b-lempute var(--protingumas) ease-out infinite;
}
@keyframes b-lempute {
  0%, 56%  { opacity: 0; transform: scale(.4); }
  60%      { opacity: 1; transform: scale(1.15); }
  64%, 78% { opacity: 1; transform: scale(1); }
  84%,100% { opacity: 0; transform: scale(.9); }
}

/* =========================================================
   3 ETAPAS: paspaudus padarėlis pašoka ir prabyla
   ========================================================= */
[data-padarelis] {
  cursor: pointer;
  touch-action: manipulation;
  outline: none;
}
[data-padarelis]:focus-visible .sokikas {
  filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 3px var(--tekstas));
}
.sokikas { display: block; transform-origin: 50% 100%; }
g.sokikas { transform-box: fill-box; transform-origin: 50% 100%; }

/* Pašokimas: susiploja, šokteli aukštyn, nusileidžia */
.sokikas.soka { animation: pasokti .7s cubic-bezier(.3,.7,.4,1); }
@keyframes pasokti {
  0%   { transform: translateY(0) scale(1, 1); }
  14%  { transform: translateY(0) scale(1.08, .9); }
  42%  { transform: translateY(-24%) scale(.95, 1.07); }
  68%  { transform: translateY(0) scale(1.07, .93); }
  84%  { transform: translateY(-4%) scale(.99, 1.01); }
  100% { transform: translateY(0) scale(1, 1); }
}
/* Lietuviukas daro kūlversčią ore! */
.sokikas.salto { transform-origin: 50% 50%; }
.sokikas.salto.soka { animation: salto .8s cubic-bezier(.4,.1,.3,1); }
@keyframes salto {
  0%   { transform: translateY(0) rotate(0deg); }
  50%  { transform: translateY(-30%) rotate(-180deg); }
  100% { transform: translateY(0) rotate(-360deg); }
}

/* Kalbėjimo debesėliai */
.debeseliai {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}
.burbulas {
  --uodega: 50%;
  position: absolute;
  left: 0;
  top: 0;
  max-width: min(62vw, 230px);
  padding: 10px 16px 12px;
  font-family: var(--sriftas-didelis);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
  color: var(--tekstas);
  background: #ffffff;
  border: 3px solid var(--tekstas);
  border-radius: 22px;
  box-shadow: 0 6px 0 rgba(74, 59, 92, 0.18);
  transform-origin: var(--uodega) 100%;
}
.burbulas::after {
  content: "";
  position: absolute;
  left: var(--uodega);
  bottom: -10px;
  width: 16px;
  height: 16px;
  margin-left: -8px;
  background: #ffffff;
  border-right: 3px solid var(--tekstas);
  border-bottom: 3px solid var(--tekstas);
  transform: rotate(45deg);
}
.burbulas.apacioje { transform-origin: var(--uodega) 0%; }
.burbulas.apacioje::after {
  bottom: auto;
  top: -10px;
  border: 0;
  border-left: 3px solid var(--tekstas);
  border-top: 3px solid var(--tekstas);
}
.burbulas.rodomas { animation: issokti .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes issokti {
  from { transform: scale(.2); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

/* Patarimas apačioje */
.patarimas {
  position: absolute;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  z-index: 9;
  margin: 0;
  padding: 8px 16px 9px;
  font-family: var(--sriftas-didelis);
  font-weight: 600;
  font-size: 17px;
  color: var(--tekstas);
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 999px;
  box-shadow: 0 4px 12px rgba(74, 59, 92, 0.15);
  pointer-events: none;
  transform: translateX(-50%);
  animation: linguoti 1.6s ease-in-out infinite;
  transition: opacity .5s;
}
.patarimas.dingsta { opacity: 0; }
@keyframes linguoti {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-5px); }
}

/* =========================================================
   4 ETAPAS: laukimo priskyrimas
   ========================================================= */
.laukimu-mygtukas {
  position: absolute;
  right: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  z-index: 11;
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  padding: 0;
  font-size: 30px;
  line-height: 1;
  background: var(--kortele);
  border: 3px solid var(--tekstas);
  border-radius: 50%;
  box-shadow: 0 5px 0 rgba(74, 59, 92, 0.25);
  cursor: pointer;
  touch-action: manipulation;
}
.laukimu-mygtukas:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(74, 59, 92, 0.25); }
.laukimu-mygtukas:focus-visible { outline: 3px solid var(--akcentas); outline-offset: 3px; }

/* Ženkliukas po padarėliu: ko jis laukia */
.zenkliukai { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.zenkliukas {
  position: absolute;
  left: 0;
  top: 0;
  max-width: 150px;
  padding: 4px 10px 5px;
  font-family: var(--sriftas);
  font-weight: 800;
  font-size: 13px;
  color: var(--tekstas);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid var(--tekstas);
  border-radius: 999px;
}

/* Skydelis „Ko laukiam?“ */
.skydelis {
  position: fixed;
  inset: 0;
  z-index: 30;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--skydelis);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  animation: iskilti .35s cubic-bezier(.2,.9,.3,1);
}
@keyframes iskilti {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.skydelio-vidus {
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.skydelio-galva {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.skydelio-galva h2 {

  font-family: var(--sriftas-didelis);
  font-weight: 800;
  font-size: 34px;
  color: var(--tekstas);
}
.uzdaryti {
  width: 48px;
  height: 48px;
  flex: none;
  font-size: 22px;
  font-weight: 800;
  color: var(--tekstas);
  background: var(--kortele);
  border: 3px solid var(--tekstas);
  border-radius: 50%;
  cursor: pointer;
}
.zingsnis { display: flex; flex-direction: column; gap: 10px; }
.zingsnis h3 {
  margin: 0;
  font-family: var(--sriftas-didelis);
  font-weight: 600;
  font-size: 21px;
  color: var(--tekstas);
}

  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-right: 6px;
  font-size: 17px;
  color: #fff;
  background: var(--akcentas);
  border-radius: 50%;
}

.padareliu-tinklelis {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.padarelio-kortele {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 10px 8px 12px;
  font-family: var(--sriftas);
  color: var(--tekstas);
  background: var(--kortele);
  border: 3px solid transparent;
  border-radius: 20px;
  box-shadow: 0 3px 10px rgba(74, 59, 92, 0.1);
  cursor: pointer;
  transition: transform .15s, border-color .15s;
}
.padarelio-kortele .portretas { display: block; width: 100%; height: 92px; }
.padarelio-kortele .portretas svg { display: block; width: 100%; height: 100%; overflow: visible; }
.padarelio-kortele .vardas { font-family: var(--sriftas-didelis); font-weight: 800; font-size: 18px; }
.padarelio-kortele .busena {
  max-width: 100%;
  font-size: 13px;
  font-weight: 700;
  color: var(--tekstas-svelnus);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.padarelio-kortele[aria-pressed="true"] {
  border-color: var(--akcentas);
  transform: translateY(-3px);
  box-shadow: 0 6px 14px rgba(240, 138, 93, 0.3);
}

.tipai {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tipas {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 8px 12px;
  font-family: var(--sriftas);
  font-weight: 800;
  font-size: 16px;
  color: var(--tekstas);
  background: var(--kortele);
  border: 3px solid transparent;
  border-radius: 16px;
  box-shadow: 0 3px 10px rgba(74, 59, 92, 0.1);
  cursor: pointer;
}
.tipas span { font-size: 24px; }
.tipas[aria-pressed="true"] { border-color: var(--akcentas); background: #fff1e8; }

.laukas {
  width: 100%;
  box-sizing: border-box;
  min-height: 52px;
  padding: 10px 14px;
  font-family: var(--sriftas);
  font-weight: 700;
  font-size: 18px;
  color: var(--tekstas);
  background: var(--kortele);
  border: 3px solid #e3d6cc;
  border-radius: 16px;
  -webkit-appearance: none;
  appearance: none;
}
.laukas:focus { outline: none; border-color: var(--akcentas); }
.laukas::placeholder { color: #b3a7a0; }

.klaida {
  margin: 0;
  font-weight: 800;
  font-size: 15px;
  color: var(--klaida);
}
.veiksmai { display: flex; flex-direction: column; gap: 10px; }
.issaugoti {
  min-height: 58px;
  font-family: var(--sriftas-didelis);
  font-weight: 800;
  font-size: 22px;
  color: #fff;
  background: var(--akcentas);
  border: 0;
  border-radius: 18px;
  box-shadow: 0 5px 0 var(--akcentas-tamsus);
  cursor: pointer;
}
.issaugoti:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--akcentas-tamsus); }
.atlaisvinti {
  min-height: 48px;
  font-family: var(--sriftas);
  font-weight: 800;
  font-size: 16px;
  color: var(--tekstas-svelnus);
  background: transparent;
  border: 2px dashed #d8c9bd;
  border-radius: 16px;
  cursor: pointer;
}
.atlaisvinti.tikrai { color: #fff; background: var(--klaida); border-color: var(--klaida); }

/* =========================================================
   5 ETAPAS: dienų skaičiavimas ir kiemas
   ========================================================= */
.laukimu-mygtukas.kaireje { right: auto; left: 16px; }

/* Debesėlis, kai padarėlis skaičiuoja dienas */
.skaiciavimas { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.skaiciavimas .s-pav { font-family: var(--sriftas); font-weight: 800; font-size: 14px; color: var(--tekstas-svelnus); }
.skaiciavimas .s-sk { font-family: var(--sriftas-didelis); font-weight: 800; font-size: 46px; line-height: 1; color: var(--akcentas); font-variant-numeric: tabular-nums; }
.skaiciavimas .s-zodis { font-size: 18px; }

/* Kiemas */
.kiemas { background: linear-gradient(180deg, #dff1ff 0%, #eef8e8 28%, #d3efd0 100%); }
.tvora { display: block; width: 100%; height: 58px; margin-bottom: -14px; }
.kiemo-sarasas { display: flex; flex-direction: column; gap: 14px; }
.kiemo-kortele {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px 10px 8px;
  text-align: left;
  font-family: var(--sriftas);
  color: var(--tekstas);
  background: var(--kortele);
  border: 0;
  border-radius: 22px;
  box-shadow: 0 4px 12px rgba(61, 107, 69, 0.14);
  cursor: pointer;
}
.kiemo-kortele .portretas { width: 80px; height: 76px; }
.kiemo-kortele .portretas svg { display: block; width: 100%; height: 100%; overflow: visible; }
.kiemo-tekstas { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kiemo-tekstas .vardas { font-family: var(--sriftas-didelis); font-weight: 800; font-size: 19px; }
.kiemo-tekstas .ivykis { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kiemo-tekstas .kada { font-weight: 700; font-size: 13px; color: var(--tekstas-svelnus); }
.kiemo-lenta {
  min-width: 74px;
  padding: 6px 8px 7px;
  text-align: center;
  color: var(--lenta-tekstas);
  background: var(--lenta);
  border: 3px solid var(--lenta-tamsi);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--lenta-tamsi);
  transform: rotate(2deg);
}
.kiemo-lenta .sk { display: block; font-family: var(--sriftas-didelis); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.kiemo-lenta .zodis { display: block; font-weight: 800; font-size: 13px; }
.kiemo-kortele:nth-child(even) .kiemo-lenta { transform: rotate(-2deg); }

.tuscias-kiemas {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 24px 16px;
  text-align: center;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 22px;
}
.tuscias-kiemas p { margin: 0; font-family: var(--sriftas-didelis); font-weight: 600; font-size: 20px; color: var(--tekstas); }
.tuscias-kiemas .issaugoti { padding: 0 22px; }

.laisvi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.laisvas {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: 6px 4px 8px;
  font-family: var(--sriftas);
  font-weight: 800;
  font-size: 13px;
  color: var(--tekstas);
  background: rgba(255, 255, 255, 0.7);
  border: 2px dashed #a9cfae;
  border-radius: 16px;
  cursor: pointer;
}
.laisvas .portretas { width: 100%; height: 54px; }
.laisvas .portretas svg { display: block; width: 100%; height: 100%; overflow: visible; }
.laisvas .prideti { font-size: 12px; color: var(--akcentas-tamsus); }

@media (prefers-reduced-motion: reduce) {
  .skydelis { animation: none; }
  .sokikas.soka, .burbulas.rodomas, .patarimas { animation: none; }
  .b-visa, .b-galva, .b-antakiai, .b-lempute, .b-sypsena-maza, .b-sypsena-didele { animation: none; }
  .p-visa, .p-sijonas, .p-galva, .p-usai, .p-sirdute { animation: none; }
  .lietuviukas-skrydis, .lietuviukas, .l-sparnas, .l-uodega, .l-snapas-apacia,
  .debesis, .saule .spinduliai, .gele, .s-kunas, .s-galva, .s-antakis, .s-ausis-desine, .zzz { animation: none; }
  .debesis.d1 { transform: translateX(12vw); }
  .debesis.d2 { transform: translateX(58vw); }
  .debesis.d3 { transform: translateX(30vw); }
}

const KALBEJIMO_LAIKAS = 3000;   // kiek milisekundžių matosi debesėlis (1000 = 1 sekundė)

/* ✨ KODO PASLAPTIS ✨  Laukimų rūšys: ženkliukas ir pavadinimas */
const TIPAI = {
  gimtadienis: { zenklas: "🎂", vardas: "Gimtadienis", pavyzdys: "Pvz.: Mano gimtadienis" },
  kelione:     { zenklas: "⛰️", vardas: "Kelionė",     pavyzdys: "Pvz.: Kelionė į kalnus" },
  svente:      { zenklas: "🎉", vardas: "Šventė",      pavyzdys: "Pvz.: Kalėdos" },
  kita:        { zenklas: "⭐", vardas: "Kita",        pavyzdys: "Pvz.: Atvažiuoja močiutė" }
};

const VARDAI = { lietuviukas: "Lietuviukas", spurga: "Spurga", sirdele: "Širdelė", braske: "Braškė" };

/* ✨ KODO PASLAPTIS ✨
   Kaip kompiuteris parenka žodį:
   1, 21, 31 … → „diena“      2–9, 22–29 … → „dienos“      10–20, 30 … → „dienų“
   Gali pakeisti žodžius, pvz., į „dienelė“, „dienelės“, „dienelių“! */
const DIENU_ZODZIAI = { viena: "diena", kelios: "dienos", daug: "dienų" };

/* ---------- Toliau – programėlės „variklis“ ---------- */
(function () {
  const pasaulis = document.querySelector(".pasaulis");
  const patarimas = document.getElementById("patarimas");

  /* --- Laukimai saugomi telefone --- */
  const RAKTAS = "laukiam-kartu-laukimai";
  let laukimai = {};
  try { laukimai = JSON.parse(localStorage.getItem(RAKTAS)) || {}; } catch (e) { laukimai = {}; }
  function issaugokTelefone() {
    try { localStorage.setItem(RAKTAS, JSON.stringify(laukimai)); } catch (e) { /* jei nepavyksta, liks iki uždarymo */ }
  }

  /* --- Datos ir dienų skaičiavimas --- */
  function siandien() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function grazusData(iso) {
    const [m, men, d] = iso.split("-").map(Number);
    const menesiai = ["sausio", "vasario", "kovo", "balandžio", "gegužės", "birželio", "liepos", "rugpjūčio", "rugsėjo", "spalio", "lapkričio", "gruodžio"];
    return menesiai[men - 1] + " " + d + " d.";
  }
  function likoDienu(iso) {
    const [m, men, d] = iso.split("-").map(Number);
    const tikslas = new Date(m, men - 1, d);
    const dabar = new Date();
    const siandienos = new Date(dabar.getFullYear(), dabar.getMonth(), dabar.getDate());
    return Math.round((tikslas - siandienos) / 86400000);
  }
  function dienuZodis(n) {
    const paskutinis = n % 10, du = n % 100;
    if (du >= 11 && du <= 19) return DIENU_ZODZIAI.daug;
    if (paskutinis === 1) return DIENU_ZODZIAI.viena;
    if (paskutinis >= 2) return DIENU_ZODZIAI.kelios;
    return DIENU_ZODZIAI.daug;
  }
  function laukimas(vardas) {
    const l = laukimai[vardas];
    return l && TIPAI[l.tipas] ? l : null;
  }

  /* --- Sluoksniai debesėliams ir ženkliukams --- */
  const debeseliai = document.createElement("div");
  debeseliai.className = "debeseliai";
  pasaulis.appendChild(debeseliai);
  const zenkliukai = document.createElement("div");
  zenkliukai.className = "zenkliukai";
  pasaulis.appendChild(zenkliukai);

  const padareliai = {};
  const kalba = new Set();

  function padekBurbula(p) {
    const ribos = pasaulis.getBoundingClientRect();
    const galva = (p.galva || p.el).getBoundingClientRect();
    const plotis = p.burbulas.offsetWidth;
    const aukstis = p.burbulas.offsetHeight;
    const centras = galva.left + galva.width / 2 - ribos.left;
    let x = centras - plotis / 2;
    x = Math.max(12, Math.min(ribos.width - plotis - 12, x));
    let y = galva.top - ribos.top - aukstis - 14;
    const apacioje = y < 8;
    if (apacioje) y = galva.bottom - ribos.top + 14;
    p.burbulas.classList.toggle("apacioje", apacioje);
    p.burbulas.style.left = x + "px";
    p.burbulas.style.top = y + "px";
    const uodega = Math.max(20, Math.min(plotis - 20, centras - x));
    p.burbulas.style.setProperty("--uodega", uodega + "px");
  }

  function padekZenkliuka(p) {
    if (p.zenkliukas.hidden) return;
    const ribos = pasaulis.getBoundingClientRect();
    const r = p.kunas.getBoundingClientRect();
    const plotis = p.zenkliukas.offsetWidth;
    let x = r.left + r.width / 2 - ribos.left - plotis / 2;
    x = Math.max(8, Math.min(ribos.width - plotis - 8, x));
    p.zenkliukas.style.left = x + "px";
    p.zenkliukas.style.top = (r.bottom - ribos.top + 2) + "px";
  }

  // Kiekvieną kadrą: debesėliai ir ženkliukai seka padarėlius (Lietuviukas juk skraido!)
  function sek() {
    kalba.forEach(padekBurbula);
    Object.values(padareliai).forEach(padekZenkliuka);
    requestAnimationFrame(sek);
  }

  function atnaujinkZenkliuka(p) {
    const l = laukimas(p.vardas);
    if (l) {
      const n = likoDienu(l.data);
      p.zenkliukas.textContent = TIPAI[l.tipas].zenklas + " " + (n > 0 ? n + " d." : "Šiandien!");
      p.zenkliukas.title = l.pavadinimas;
      p.zenkliukas.hidden = false;
    } else {
      p.zenkliukas.hidden = true;
    }
  }

  function skaiciavimas(l) {
    const n = likoDienu(l.data);
    const dezute = document.createElement("div");
    dezute.className = "skaiciavimas";
    const pav = document.createElement("span");
    pav.className = "s-pav";
    pav.textContent = TIPAI[l.tipas].zenklas + " " + l.pavadinimas;
    const sk = document.createElement("span");
    sk.className = "s-sk";
    const zodis = document.createElement("span");
    zodis.className = "s-zodis";
    if (n <= 0) {
      sk.textContent = "🎉";
      zodis.textContent = "Šiandien!";
    } else {
      sk.textContent = n;
      zodis.textContent = dienuZodis(n) + " liko!" + (n === 1 ? " Jau rytoj!" : "");
    }
    dezute.append(pav, sk, zodis);
    return dezute;
  }

  function prabilk(p, tekstas) {
    // 1. Pašoka
    p.sokikas.classList.remove("soka");
    void p.sokikas.getBoundingClientRect();
    p.sokikas.classList.add("soka");

    // 2. Jei laukia – pasako, kiek liko. Paspaudus dar kartą – pasako savo sakinį.
    const l = laukimas(p.vardas);
    if (!tekstas && l && !(p.rodeSkaiciu && kalba.has(p))) {
      tekstas = skaiciavimas(l);
      p.rodeSkaiciu = true;
    } else {
      p.rodeSkaiciu = false;
    }
    // Išsirenka sakinį (ne tą patį, kaip praeitą kartą)
    if (!tekstas) {
      const frazes = FRAZES[p.vardas] || ["Labas!"];
      let i;
      do { i = Math.floor(Math.random() * frazes.length); }
      while (frazes.length > 1 && i === p.paskutine);
      p.paskutine = i;
      tekstas = frazes[i];
    }

    // 3. Kiti nutyla (kalba po vieną), o šis parodo debesėlį
    kalba.forEach(function (q) {
      if (q !== p) { clearTimeout(q.laikmatis); q.burbulas.hidden = true; kalba.delete(q); }
    });
    if (typeof tekstas === "string") p.burbulas.textContent = tekstas;
    else p.burbulas.replaceChildren(tekstas);
    p.burbulas.hidden = false;
    p.burbulas.classList.remove("rodomas");
    void p.burbulas.offsetWidth;
    p.burbulas.classList.add("rodomas");
    kalba.add(p);
    padekBurbula(p);

    clearTimeout(p.laikmatis);
    p.laikmatis = setTimeout(function () {
      p.burbulas.hidden = true;
      kalba.delete(p);
    }, KALBEJIMO_LAIKAS);

    if (patarimas) patarimas.classList.add("dingsta");
  }

  document.querySelectorAll("[data-padarelis]").forEach(function (el) {
    const p = {
      vardas: el.dataset.padarelis,
      el: el,
      galva: el.dataset.galva ? el.querySelector(el.dataset.galva) : el.querySelector("svg"),
      sokikas: el.querySelector(".sokikas"),
      kunas: el.querySelector(".sokikas") || el,
      burbulas: document.createElement("div"),
      zenkliukas: document.createElement("div"),
      paskutine: -1,
      laikmatis: 0
    };
    p.burbulas.className = "burbulas";
    p.burbulas.hidden = true;
    p.burbulas.setAttribute("role", "status");
    debeseliai.appendChild(p.burbulas);
    p.zenkliukas.className = "zenkliukas";
    p.zenkliukas.hidden = true;
    zenkliukai.appendChild(p.zenkliukas);
    padareliai[p.vardas] = p;
    atnaujinkZenkliuka(p);

    p.sokikas.addEventListener("animationend", function (e) {
      if (e.target === p.sokikas) p.sokikas.classList.remove("soka");
    });
    el.addEventListener("click", function () { prabilk(p); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); prabilk(p); }
    });
  });
  requestAnimationFrame(sek);

  /* =========================================================
     Skydelis „Ko laukiam?“
     ========================================================= */
  const skydelis = document.getElementById("skydelis");
  const korteles = document.getElementById("korteles");
  const tipai = document.getElementById("tipai");
  const pavadinimas = document.getElementById("pavadinimas");
  const data = document.getElementById("data");
  const klaida = document.getElementById("klaida");
  const atlaisvinti = document.getElementById("atlaisvinti");
  const atidaryti = document.getElementById("atidaryti");

  let pasirinktas = "lietuviukas";
  let pasirinktasTipas = "gimtadienis";


  // Gyvas padarėlio portretas (kopija iš pasaulio)
  function sukurkPortreta(vardas) {
    const portretas = document.createElement("div");
    portretas.className = "portretas";
    const kopija = padareliai[vardas].el.querySelector("svg").cloneNode(true);
    kopija.querySelectorAll("[id]").forEach(function (x) { x.removeAttribute("id"); });
    kopija.querySelectorAll(".soka").forEach(function (x) { x.classList.remove("soka"); });
    // Aukštiems padarėliams portrete rodom tik viršutinę dalį
    const iskarpa = { sirdele: "8 4 104 112", braske: "2 0 96 104" }[vardas];
    if (iskarpa) { kopija.setAttribute("viewBox", iskarpa); kopija.style.overflow = "hidden"; }
    portretas.appendChild(kopija);
    return portretas;
  }

  // Padarėlių kortelės (su gyvais portretais)
  Object.keys(VARDAI).forEach(function (vardas) {
    const p = padareliai[vardas];
    const mygtukas = document.createElement("button");
    mygtukas.type = "button";
    mygtukas.className = "padarelio-kortele";
    mygtukas.dataset.vardas = vardas;
    const portretas = sukurkPortreta(vardas);
    const v = document.createElement("span"); v.className = "vardas"; v.textContent = VARDAI[vardas];
    const b = document.createElement("span"); b.className = "busena";
    mygtukas.append(portretas, v, b);
    mygtukas.addEventListener("click", function () { rinkisPadareli(vardas); });
    korteles.appendChild(mygtukas);
  });

  // Laukimų rūšių mygtukai
  Object.keys(TIPAI).forEach(function (raktas) {
    const t = TIPAI[raktas];
    const mygtukas = document.createElement("button");
    mygtukas.type = "button";
    mygtukas.className = "tipas";
    mygtukas.dataset.tipas = raktas;
    const z = document.createElement("span"); z.textContent = t.zenklas;
    mygtukas.append(z, document.createTextNode(t.vardas));
    mygtukas.addEventListener("click", function () { rinkisTipa(raktas); });
    tipai.appendChild(mygtukas);
  });

  function atnaujinkKorteles() {
    korteles.querySelectorAll(".padarelio-kortele").forEach(function (k) {
      const l = laukimai[k.dataset.vardas];
      k.setAttribute("aria-pressed", String(k.dataset.vardas === pasirinktas));
      k.querySelector(".busena").textContent = l && TIPAI[l.tipas]
        ? TIPAI[l.tipas].zenklas + " " + l.pavadinimas
        : "Laisvas 🙂";
    });
  }

  function rinkisTipa(raktas) {
    pasirinktasTipas = raktas;
    tipai.querySelectorAll(".tipas").forEach(function (t) {
      t.setAttribute("aria-pressed", String(t.dataset.tipas === raktas));
    });
    pavadinimas.placeholder = TIPAI[raktas].pavyzdys;
  }

  function rinkisPadareli(vardas) {
    pasirinktas = vardas;
    const l = laukimai[vardas];
    rinkisTipa(l ? l.tipas : "gimtadienis");
    pavadinimas.value = l ? l.pavadinimas : "";
    data.value = l ? l.data : "";
    atlaisvinti.hidden = !l;
    atlaisvinti.classList.remove("tikrai");
    atlaisvinti.textContent = "Atlaisvinti padarėlį";
    klaida.hidden = true;
    atnaujinkKorteles();
  }

  function rodykKlaida(tekstas) {
    klaida.textContent = tekstas;
    klaida.hidden = false;
  }

  function atidaryk(kas) {
    data.min = siandien();
    const laisvas = Object.keys(VARDAI).find(function (v) { return !laukimai[v]; });
    rinkisPadareli(typeof kas === "string" ? kas : (laisvas || "lietuviukas"));
    skydelis.hidden = false;
    if (patarimas) patarimas.classList.add("dingsta");
  }
  function uzdaryk() {
    skydelis.hidden = true;
    atidaryti.focus();
  }

  document.getElementById("issaugoti").addEventListener("click", function () {
    const pav = pavadinimas.value.trim() || TIPAI[pasirinktasTipas].vardas;
    if (!data.value) { rodykKlaida("Pasirink dieną, kurios lauksim 📅"); return; }
    if (data.value < siandien()) { rodykKlaida("Ši diena jau praėjo. Pasirink būsimą dieną 🙂"); return; }
    laukimai[pasirinktas] = { tipas: pasirinktasTipas, pavadinimas: pav, data: data.value };
    issaugokTelefone();
    const p = padareliai[pasirinktas];
    atnaujinkZenkliuka(p);
    uzdaryk();
    setTimeout(function () {
      prabilk(p, "Hurra! Lauksiu: " + pav + " (" + grazusData(data.value) + ") 🎉");
    }, 250);
  });

  atlaisvinti.addEventListener("click", function () {
    if (!atlaisvinti.classList.contains("tikrai")) {
      atlaisvinti.classList.add("tikrai");
      atlaisvinti.textContent = "Tikrai? Paspausk dar kartą";
      return;
    }
    delete laukimai[pasirinktas];
    issaugokTelefone();
    const p = padareliai[pasirinktas];
    atnaujinkZenkliuka(p);
    uzdaryk();
    setTimeout(function () { prabilk(p, "Jėj, aš vėl laisvas! Ko lauksim dabar?"); }, 250);
  });

  /* =========================================================
     Kiemas: visi laukimai kartu
     ========================================================= */
  const kiemas = document.getElementById("kiemas");
  const kiemoSarasas = document.getElementById("kiemo-sarasas");
  const tusciasKiemas = document.getElementById("tuscias-kiemas");
  const laisvi = document.getElementById("laisvi");
  const laisvuZingsnis = document.getElementById("laisvu-zingsnis");
  const iKiema = document.getElementById("i-kiema");

  function pieskKiema() {
    kiemoSarasas.replaceChildren();
    laisvi.replaceChildren();
    const visi = Object.keys(VARDAI);
    const laukiantys = visi.filter(laukimas).sort(function (a, b) {
      return laukimai[a].data.localeCompare(laukimai[b].data);
    });
    const neuzimti = visi.filter(function (v) { return !laukimas(v); });

    laukiantys.forEach(function (vardas) {
      const l = laukimai[vardas];
      const n = likoDienu(l.data);
      const korta = document.createElement("button");
      korta.type = "button";
      korta.className = "kiemo-kortele";
      const portretas = sukurkPortreta(vardas);
      portretas.classList.add("sokikas");
      const tekstas = document.createElement("div");
      tekstas.className = "kiemo-tekstas";
      const v = document.createElement("span"); v.className = "vardas"; v.textContent = VARDAI[vardas];
      const iv = document.createElement("span"); iv.className = "ivykis"; iv.textContent = TIPAI[l.tipas].zenklas + " " + l.pavadinimas;
      const kada = document.createElement("span"); kada.className = "kada"; kada.textContent = grazusData(l.data);
      tekstas.append(v, iv, kada);
      const lenta = document.createElement("div");
      lenta.className = "kiemo-lenta";
      const sk = document.createElement("span"); sk.className = "sk";
      const zodis = document.createElement("span"); zodis.className = "zodis";
      if (n <= 0) { sk.textContent = "🎉"; zodis.textContent = "Šiandien!"; }
      else { sk.textContent = n; zodis.textContent = dienuZodis(n); }
      lenta.append(sk, zodis);
      korta.append(portretas, tekstas, lenta);
      korta.setAttribute("aria-label", VARDAI[vardas] + " laukia: " + l.pavadinimas + ". " + (n > 0 ? "Liko " + n + " " + dienuZodis(n) : "Šiandien!"));
      korta.addEventListener("click", function () {
        portretas.classList.remove("soka");
        void portretas.offsetWidth;
        portretas.classList.add("soka");
      });
      portretas.addEventListener("animationend", function (e) {
        if (e.target === portretas) portretas.classList.remove("soka");
      });
      kiemoSarasas.appendChild(korta);
    });
    tusciasKiemas.hidden = laukiantys.length > 0;

    neuzimti.forEach(function (vardas) {
      const m = document.createElement("button");
      m.type = "button";
      m.className = "laisvas";
      const v = document.createElement("span"); v.textContent = VARDAI[vardas];
      const pr = document.createElement("span"); pr.className = "prideti"; pr.textContent = "+ diena";
      m.append(sukurkPortreta(vardas), v, pr);
      m.setAttribute("aria-label", "Priskirti dieną: " + VARDAI[vardas]);
      m.addEventListener("click", function () { kiemas.hidden = true; atidaryk(vardas); });
      laisvi.appendChild(m);
    });
    laisvuZingsnis.hidden = neuzimti.length === 0;
  }

  function atidarykKiema() {
    pieskKiema();
    kiemas.hidden = false;
    if (patarimas) patarimas.classList.add("dingsta");
  }
  function uzdarykKiema() {
    kiemas.hidden = true;
    iKiema.focus();
  }

  iKiema.addEventListener("click", atidarykKiema);
  document.getElementById("kiemas-uzdaryti").addEventListener("click", uzdarykKiema);
  document.getElementById("kiemas-priskirti").addEventListener("click", function () { kiemas.hidden = true; atidaryk(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !kiemas.hidden) uzdarykKiema();
  });

  // Kas minutę (ir grįžus į programėlę) dienos persiskaičiuoja
  function atnaujinkViska() {
    Object.values(padareliai).forEach(atnaujinkZenkliuka);
    if (!kiemas.hidden) pieskKiema();
  }
  setInterval(atnaujinkViska, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) atnaujinkViska(); });

  atidaryti.addEventListener("click", atidaryk);
  document.getElementById("uzdaryti").addEventListener("click", uzdaryk);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !skydelis.hidden) uzdaryk();
  });
})();
</script>

</body>
</html>
